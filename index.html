<style>
:root{
  --gold:#c9a96e; --gold-2:#e8d19f;
  --ink:#0d0d0d; --text:#f2ece2; --dim:rgba(242,236,226,.74);
  --line:rgba(201,169,110,.30);
  --f-head:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-body:'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --px:0; --py:0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}

.snap{height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;overscroll-behavior:none;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.snap::-webkit-scrollbar{display:none}
.screen{position:relative;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;
  scroll-snap-align:start;scroll-snap-stop:always}

.ico{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

.rv{opacity:0;transform:translateY(18px);
  transition:opacity .9s var(--ease),transform .9s var(--ease);
  transition-delay:var(--delay,0ms)}
.screen.is-active .rv{opacity:1;transform:none}
.screen:not(.is-active) .rv{transition-delay:0ms;transition-duration:.25s}

/* ЭКРАН 1 */
.screen--hero{justify-content:center;text-align:center}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:-3;background:#0d0d0d}
.hero-shade{position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse at center,rgba(13,13,13,.18) 0%,rgba(13,13,13,.62) 100%),
    linear-gradient(180deg,rgba(13,13,13,.55) 0%,rgba(13,13,13,.10) 40%,rgba(13,13,13,.78) 100%)}
#embers{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero-content{position:relative;padding:2rem 1.25rem;max-width:62rem;
  transform:translate3d(calc(var(--px)*7px),calc(var(--py)*5px),0);transition:transform .5s ease-out}

.eyebrow{display:flex;align-items:center;gap:.8rem;font-size:.72rem;font-weight:500;
  letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.eyebrow::after{content:"";height:1px;width:2.4rem;background:var(--line)}
.eyebrow--center{justify-content:center}
.eyebrow--center::before{content:"";height:1px;width:2.4rem;background:var(--line)}

.hero-title{font-family:var(--f-head);font-weight:700;color:var(--gold);
  font-size:clamp(2.9rem,9vw,7rem);line-height:1.05;letter-spacing:.015em;margin-top:.9rem;
  text-shadow:0 4px 40px rgba(0,0,0,.6)}
.letter{display:inline-block;opacity:0;transform:translateY(.5em);filter:blur(10px)}
.screen.is-active .letter{animation:letterIn 1s var(--ease) both;animation-delay:calc(var(--i)*55ms + 150ms)}
@keyframes letterIn{to{opacity:1;transform:none;filter:blur(0)}}

.rule{display:block;height:1px;width:0;margin:1.1rem auto 1.25rem;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  transition:width 1.3s var(--ease) 1s}
.screen.is-active .rule{width:min(240px,55vw)}
.screen:not(.is-active) .rule{transition-delay:0s;transition-duration:.2s}

.hero-slogan{font-family:var(--f-head);font-style:italic;font-weight:500;
  font-size:clamp(1.15rem,2.6vw,1.7rem);color:var(--dim);letter-spacing:.03em;margin-bottom:2.3rem}
.hero-buttons{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap}

/* КНОПКИ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.65rem;
  padding:.95rem 1.7rem;border-radius:999px;border:1.5px solid var(--gold);color:var(--gold);
  font:500 .8rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
  overflow:hidden;cursor:pointer;background:rgba(255,255,255,.03);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:transform .35s var(--ease),box-shadow .35s,background .35s,color .35s}
.btn::after{content:"";position:absolute;inset:0;transform:translateX(-130%);
  background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.38) 50%,transparent 68%);
  transition:transform .9s var(--ease)}
.btn:hover::after,.btn:focus-visible::after{transform:translateX(130%)}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 12px 34px rgba(201,169,110,.22);outline:none}
.btn .ico{transition:transform .35s var(--ease)}
.btn:hover .ico--go{transform:translateX(4px)}
.btn--gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#15110d;border-color:transparent;
  box-shadow:0 10px 30px rgba(201,169,110,.28)}
.btn--wide{width:100%}

/* ПОДСКАЗКА */
.hint{position:absolute;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:.1rem;background:none;border:0;cursor:pointer;
  color:var(--dim);font-size:.68rem;letter-spacing:.26em;text-transform:uppercase}
.hint .ico{width:1.1rem;height:1.1rem;color:var(--gold);animation:chev 2s ease-in-out infinite}
.hint .ico:nth-of-type(2){animation-delay:.25s;margin-top:-.55rem}
@keyframes chev{0%{opacity:0;transform:translateY(-5px)}50%{opacity:1}100%{opacity:0;transform:translateY(6px)}}

/* ЭКРАНЫ 2 И 3 */
.screen--photo{padding-inline:clamp(1.25rem,6vw,7rem)}
.screen--left{justify-content:flex-start}
.screen--right{justify-content:flex-end}

.bg-wrap{position:absolute;inset:0;z-index:-2;overflow:hidden;background:#0d0d0d}
.bg-photo,.bg-video-2{width:100%;height:100%;object-fit:cover;object-position:center;display:block}

.shade{position:absolute;inset:0;z-index:-1}
.screen--left  .shade{background:
  linear-gradient(90deg,rgba(9,9,9,.86) 0%,rgba(9,9,9,.55) 34%,rgba(9,9,9,.06) 62%,transparent 100%),
  linear-gradient(180deg,rgba(9,9,9,.35),transparent 25%,transparent 75%,rgba(9,9,9,.4))}
.screen--right .shade{background:
  linear-gradient(270deg,rgba(9,9,9,.86) 0%,rgba(9,9,9,.55) 34%,rgba(9,9,9,.06) 62%,transparent 100%),
  linear-gradient(180deg,rgba(9,9,9,.35),transparent 25%,transparent 75%,rgba(9,9,9,.4))}

.panel{position:relative;width:min(100%,30rem);max-height:calc(100dvh - 3rem);overflow:auto;overscroll-behavior:contain;
  padding:clamp(1.4rem,2.4vw,2.4rem);border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(26,23,20,.74),rgba(11,11,11,.62));
  -webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);
  box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
  scrollbar-width:thin;
  opacity:0;transform:translateX(calc(var(--dir,-1)*54px));
  transition:opacity 1s var(--ease),transform 1s var(--ease)}
.screen--right .panel{--dir:1}
.screen.is-active .panel{opacity:1;transform:none}
.screen:not(.is-active) .panel{transition-duration:.25s}
.panel::before{content:"";position:absolute;left:2rem;top:-1px;width:64px;height:2px;
  background:linear-gradient(90deg,var(--gold),transparent)}
.panel h2{font-family:var(--f-head);font-weight:600;color:var(--gold-2);
  font-size:clamp(2rem,3.3vw,3rem);line-height:1.05;margin:.7rem 0 .35rem}
.panel .sub{font-family:var(--f-head);font-style:italic;font-size:1.15rem;color:var(--dim);margin-bottom:1.3rem}

.feat,.info{display:flex;gap:.95rem;align-items:flex-start}
.feat+.feat,.info+.info{margin-top:1rem}
.ic{flex:0 0 2.6rem;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;
  color:var(--gold);border:1px solid var(--line);background:rgba(201,169,110,.08);
  transition:background .35s,color .35s,transform .35s var(--ease)}
.ic .ico{width:1.2rem;height:1.2rem}
.feat p{color:var(--dim);font-size:.95rem;line-height:1.65;padding-top:.3rem}
.info .lbl{display:block;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.15rem}
.info .val{display:block;font-size:1.02rem;line-height:1.45;color:var(--text);text-decoration:none}
a.info:hover .ic,a.info:focus-visible .ic{background:var(--gold);color:#15110d;transform:scale(1.08)}
a.info{text-decoration:none;color:inherit}

.cta{margin-top:1.5rem}
.panel-foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:1.2rem;flex-wrap:wrap}
.socials{display:flex;gap:.6rem}
.soc{width:2.7rem;height:2.7rem;border-radius:50%;display:grid;place-items:center;color:var(--gold);
  border:1px solid var(--line);text-decoration:none;
  transition:background .35s,color .35s,transform .35s var(--ease)}
.soc:hover,.soc:focus-visible{background:var(--gold);color:#15110d;transform:translateY(-3px);outline:none}
.maplink{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .3s}
.maplink:hover{border-bottom-color:var(--gold)}
.maplink .ico{width:1rem;height:1rem}

/* НАВИГАЦИЯ */
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:30;pointer-events:none}
.progress i{display:block;height:100%;transform-origin:left;transform:scaleX(0);
  background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.dots{position:fixed;right:clamp(.6rem,1.6vw,1.6rem);top:50%;transform:translateY(-50%);z-index:20;
  display:flex;flex-direction:column;gap:1rem}
.dot{position:relative;width:.75rem;height:.75rem;border-radius:50%;border:1.5px solid var(--gold);
  background:transparent;cursor:pointer;padding:0;transition:background .3s,transform .3s var(--ease),box-shadow .3s}
.dot::before{content:"";position:absolute;inset:-.65rem}
.dot.active{background:var(--gold);transform:scale(1.2);box-shadow:0 0 0 5px rgba(201,169,110,.18)}
.dot span{position:absolute;right:1.7rem;top:50%;transform:translate(6px,-50%);white-space:nowrap;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s var(--ease)}
.dot:hover span,.dot:focus-visible span{opacity:1;transform:translate(0,-50%)}
.counter{position:fixed;left:clamp(1.25rem,6vw,7rem);bottom:calc(1.6rem + env(safe-area-inset-bottom));z-index:20;
  display:flex;align-items:center;gap:.75rem;font-size:.72rem;letter-spacing:.2em;color:var(--dim);pointer-events:none}
.counter b{font-family:var(--f-head);font-size:1.5rem;font-weight:600;color:var(--gold);letter-spacing:.04em}
.counter i{display:block;width:2.6rem;height:1px;background:var(--line)}

:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

@media (max-width:1100px){
  .panel{width:min(100%,27rem)}
}

/* ТЕЛЕФОН И ПЛАНШЕТ В ПОРТРЕТЕ */
@media (max-width:700px),(orientation:portrait) and (max-width:1024px){
  .screen--photo{align-items:flex-end;justify-content:center;
    padding:0 .9rem calc(1rem + env(safe-area-inset-bottom))}
  .panel{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(14,13,12,.88)}
  .btn{-webkit-backdrop-filter:none;backdrop-filter:none}
  .letter{filter:none}

  .screen--left .shade,.screen--right .shade{background:
    linear-gradient(0deg,rgba(9,9,9,.88) 0%,rgba(9,9,9,.55) 42%,transparent 72%),
    linear-gradient(180deg,rgba(9,9,9,.35),transparent 22%)}

  .panel{width:100%;max-width:34rem;max-height:60dvh;padding:1.25rem 1.2rem;border-radius:20px;
    transform:translateY(46px)}
  .panel::before{left:1.4rem}
  .panel h2{font-size:1.9rem;margin-top:.5rem}
  .panel .sub{font-size:1.05rem;margin-bottom:.9rem}
  .feat p{font-size:.9rem;line-height:1.55}
  .ic{flex-basis:2.3rem;width:2.3rem;height:2.3rem}
  .info .val{font-size:.95rem}
  .info+.info,.feat+.feat{margin-top:.75rem}
  .cta{margin-top:1.1rem}
  .btn{padding:.9rem 1.3rem}
  .counter{display:none}
  .dots{right:.45rem;gap:.85rem}
  .hero-slogan{margin-bottom:1.8rem}
}
@media (max-width:700px) and (max-height:700px){
  .panel .eyebrow{display:none}
  .panel h2{font-size:1.65rem;margin-top:0}
}

.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
.rm .rv,.rm .panel,.rm .letter{opacity:1!important;transform:none!important;filter:none!important}
.rm .rule{width:min(240px,55vw)!important}
</style>
<noscript><style>.rv,.panel,.letter{opacity:1!important;transform:none!important;filter:none!important}.rule{width:200px}</style></noscript>
</head>

<div class="progress" aria-hidden="true"><i id="bar"></i></div>

<main class="snap" id="snap">

  <!-- ЭКРАН 1 -->
  <section class="screen screen--hero" id="s1" aria-label="Главная">

      <svg class="ico"><use href="#i-down"/></svg>

  <!-- ЭКРАН 2 (видео) -->
  <section class="screen screen--photo screen--right" id="s2" aria-label="О ресторане">

      <div class="feat rv" style="--delay:550ms">

        <p data-t="about1">[текст о ресторане]</p>
      </div>
      <div class="feat rv" style="--delay:650ms">
        <span class="ic"><svg class="ico"><use href="#i-food"/></svg></span>
        <p data-t="about2">[текст о кухне]</p>
      </div>
      <div class="feat rv" style="--delay:750ms">
        <span class="ic"><svg class="ico"><use href="#i-spark"/></svg></span>
        <p data-t="about3">[текст об атмосфере]</p>
      </div>
    </article>
  </section>

  <!-- ЭКРАН 3 (фото) -->
  <section class="screen screen--photo screen--left" id="s3" aria-label="Контакты">
    <div class="bg-wrap"><img class="bg-photo" src="photo2.jpg" alt="" loading="lazy" decoding="async"></div>
    <div class="shade"></div>

    <article class="panel">
      <p class="eyebrow rv" style="--delay:250ms">03 · Контакты</p>
      <h2 class="rv" style="--delay:350ms">Контакты</h2>

      <div class="info rv" style="--delay:480ms">

      <a class="info rv" style="--delay:580ms" href="#" data-tel>

        <span class="ic"><svg class="ico"><use href="#i-clock"/></svg></span>
        <div><span class="lbl">Часы работы</span><span class="val" data-t="hours">[часы работы]</span></div>

      <div class="cta rv" style="--delay:800ms">
        <a class="btn btn--gold btn--wide" href="#" data-tel>
          <svg class="ico"><use href="#i-cal"/></svg>Забронировать стол<svg class="ico ico--go"><use href="#i-go"/></svg>

      <div class="panel-foot rv" style="--delay:900ms">
        <div class="socials">
          <a class="soc" href="#" data-href="instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg class="ico"><use href="#i-insta"/></svg></a>
          <a class="soc" href="#" data-href="telegram"  target="_blank" rel="noopener noreferrer" aria-label="Telegram"><svg class="ico"><use href="#i-tg"/></svg></a>
          <a class="soc" href="#" data-href="vk"        target="_blank" rel="noopener noreferrer" aria-label="ВКонтакте"><svg class="ico"><use href="#i-vk"/></svg></a>
        </div>
        <a class="maplink" href="#" data-href="mapUrl" target="_blank" rel="noopener noreferrer">Как добраться<svg class="ico"><use href="#i-out"/></svg></a>
      </div>

</main>

<script>
(function () {
  'use strict';
  var C = window.SITE || {};
  var snap = document.getElementById('snap');
  var screens = Array.prototype.slice.call(document.querySelectorAll('.screen'));
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));
  var cnt = document.getElementById('cnt');
  var bar = document.getElementById('bar');
  var current = 0;

  var rmQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var respectRM = window.RESPECT_REDUCED_MOTION === true && rmQuery.matches;
  if (respectRM) document.documentElement.classList.add('rm');

  /* ---------- тексты и ссылки ---------- */
  var phoneText = C.phoneText || C.phone;
  document.querySelectorAll('[data-t]').forEach(function (el) {
    var k = el.getAttribute('data-t');
    var val = k === 'phoneText' ? phoneText : C[k];
    if (val) el.textContent = val;
  });
  document.querySelectorAll('[data-href]').forEach(function (el) {
    var val = C[el.getAttribute('data-href')];
    if (val) el.setAttribute('href', val);
  });
  document.querySelectorAll('[data-tel]').forEach(function (el) {
    if (C.phone) el.setAttribute('href', 'tel:' + String(C.phone).replace(/[^\d+]/g, ''));
  });
  document.querySelectorAll('a[href="#"]').forEach(function (a) {
    a.addEventListener('click', function (e) { e.preventDefault(); });
  });

  /* ---------- заголовок по буквам ---------- */
  var title = document.getElementById('title');
  if (title) {
    var txt = title.textContent; title.textContent = '';
    Array.prototype.forEach.call(txt, function (ch, i) {
      var s = document.createElement('span');
      s.className = 'letter'; s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--i', i);
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      title.appendChild(s);
    });
  }

  /* ---------- навигация ---------- */
  function goTo(i) {
    if (i < 0 || i >= screens.length) return;
    screens[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { goTo(parseInt(b.getAttribute('data-go'), 10)); });
  });
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowDown' || k === 'PageDown') { e.preventDefault(); goTo(current + 1); }
    else if (k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); goTo(current - 1); }
    else if (k === 'Home') { e.preventDefault(); goTo(0); }
    else if (k === 'End')  { e.preventDefault(); goTo(screens.length - 1); }
  });

  var embers; /* объявлено заранее, создаётся ниже */

  function setActive(i) {
    current = i;
    screens.forEach(function (s, n) { s.classList.toggle('is-active', n === i); });
    dots.forEach(function (d, n) { d.classList.toggle('active', n === i); });
    cnt.textContent = '0' + (i + 1);
    if (embers) { if (i === 0) embers.start(); else embers.stop(); }
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) setActive(screens.indexOf(en.target));
    });
  }, { root: snap, threshold: 0.6 });

  var ticking = false;
  snap.addEventListener('scroll', function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () {
      var max = snap.scrollHeight - snap.clientHeight;
      bar.style.transform = 'scaleX(' + (max > 0 ? snap.scrollTop / max : 0) + ')';
      ticking = false;
    });
  }, { passive: true });

  /* ---------- параллакс ---------- */
  if (!respectRM && window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
    var pending = false, mx = 0, my = 0;
    window.addEventListener('pointermove', function (e) {
      mx = (e.clientX / window.innerWidth - .5) * 2;
      my = (e.clientY / window.innerHeight - .5) * 2;
      if (pending) return; pending = true;
      requestAnimationFrame(function () {
        var r = document.documentElement.style;
        r.setProperty('--px', mx.toFixed(3)); r.setProperty('--py', my.toFixed(3));
        pending = false;
      });
    }, { passive: true });
  }

  /* ---------- искры ---------- */
  embers = (function () {
    var cv = document.getElementById('embers');
    if (!cv || !cv.getContext || respectRM) return { start: function () {}, stop: function () {} };
    var ctx = cv.getContext('2d'), W = 0, H = 0, parts = [], raf = 0, run = false;
    function resize() {
      var d = Math.min(window.devicePixelRatio || 1, window.innerWidth < 700 ? 1.25 : 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function spawn(init) {
      return { x: Math.random() * W, y: init ? Math.random() * H : H + 12,
        r: Math.random() * 1.7 + .6, vy: -(Math.random() * .55 + .25), vx: (Math.random() - .5) * .25,
        ph: Math.random() * 6.28, a: Math.random() * .55 + .3 };
    }
    function init() {
      resize(); parts = [];
      var n = W < 700 ? 14 : 46;
      for (var i = 0; i < n; i++) parts.push(spawn(true));
    }
    function frame(t) {
      if (!run) return;
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.y += p.vy; p.x += p.vx + Math.sin(t / 900 + p.ph) * .28;
        if (p.y < -14) parts[i] = spawn(false);
        var tw = .55 + .45 * Math.sin(t / 420 + p.ph);
        ctx.fillStyle = 'rgba(232,180,100,' + (p.a * .10 * tw).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.4, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgba(255,214,150,' + (p.a * tw).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(init, 200); });
    init();
    return {
      start: function () { if (run) return; run = true; raf = requestAnimationFrame(frame); },
      stop:  function () { run = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); }
    };
  })();

  screens.forEach(function (s) { io.observe(s); });
  setActive(0);

  /* ==================== ВИДЕО ==================== */
  var mqPhone = window.matchMedia('(max-width:700px), (orientation:portrait) and (max-width:1024px)');
  var mqSmall = window.matchMedia('(max-width:900px), (max-height:560px) and (orientation:landscape)');
  var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var saveData = !!(conn && (conn.saveData || /(^|-)2g$/.test(conn.effectiveType || '')));

  /* Общая функция: подбирает файл под экран, грузит, играет только когда экран виден */
  function setupVideo(video, section, pick) {
    if (!video || !section) return;
    var cur = '';
    var visible = false;

    function play() {
      if (!cur || saveData || !visible) return;
      video.muted = true;
      var pr = video.play();
      if (pr && pr.catch) pr.catch(function () {});
    }
    function load() {
      var set = pick();
      video.setAttribute('poster', set.p);
      if (saveData || set.v === cur) return;
      cur = set.v;
      video.muted = true;
      video.defaultMuted = true;
      video.preload = 'auto';
      video.src = set.v;
      video.load();
      play();
    }

    video.setAttribute('poster', pick().p);
    if (document.readyState === 'complete') load(); else window.addEventListener('load', load, { once: true });

    if (mqPhone.addEventListener) mqPhone.addEventListener('change', load);
    if (mqSmall.addEventListener) mqSmall.addEventListener('change', load);

    video.addEventListener('loadeddata', play);
    video.addEventListener('canplay', play);
    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(function (ev) {
      window.addEventListener(ev, play, { once: true, passive: true });
    });

    new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        visible = en.isIntersecting;
        if (visible) play(); else video.pause();
      });
    }, { root: snap, threshold: 0.25 }).observe(section);
  }

  /* Экран 1 */
  setupVideo(document.querySelector('.bg-video'), document.getElementById('s1'), function () {
    if (mqPhone.matches) return { v: 'hero2-m.mp4', p: 'poster2-m.jpg' };
    if (mqSmall.matches) return { v: 'hero-s.mp4',  p: 'poster-s.jpg' };
    return { v: 'hero2.mp4', p: 'poster2.jpg' };
  });

  /* Экран 2: имена БЕЗ пробелов и скобок */
  setupVideo(document.querySelector('.bg-video-2'), document.getElementById('s2'), function () {
    if (mqPhone.matches) return { v: 'about-m.mp4', p: 'about-poster-m.jpg' };
    if (mqSmall.matches) return { v: 'about-m.mp4', p: 'about-poster-m.jpg' };
    return { v: 'about.mp4', p: 'about-poster.jpg' };
  });
})();
</script>
</body>
